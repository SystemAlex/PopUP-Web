<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PopUp WEB</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div class="flex-box-column">
          <p class="eyebrow">Visualizador Pro</p>
          <h1>PopUp WEB</h1>
          <p id="active-tab-preview" class="description">Detectando
            pestaña...</p>
        </div>

        <div id="status-icon" class="tool-icon">
          <span slot="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32"
              height="32" viewBox="0 0 20 20">
              <path fill="#B10E1C"
                d="M10 2a8 8 0 1 1 0 16a8 8 0 0 1 0-16M7.81 7.114a.5.5 0 0 0-.638.058l-.058.069a.5.5 0 0 0 .058.638L9.292 10l-2.12 2.121l-.058.07a.5.5 0 0 0 .058.637l.069.058a.5.5 0 0 0 .638-.058L10 10.708l2.121 2.12l.07.058a.5.5 0 0 0 .637-.058l.058-.069a.5.5 0 0 0-.058-.638L10.708 10l2.12-2.121l.058-.07a.5.5 0 0 0-.058-.637l-.069-.058a.5.5 0 0 0-.638.058L10 9.292l-2.121-2.12z">
              </path>
            </svg>
          </span>
        </div>
      </header>

      <div class="form">
        <div class="presets">
          <label class="field">
            <span>Tamaños predeterminados</span>
            <select id="size-presets" class="select">
              <button>
                <selectedcontent></selectedcontent>
              </button>
              <option value="custom">Personalizado</option>
              <option value="360x640">Móvil (360x640)</option>
              <option value="480x720">PopUp (480x720)</option>
              <option value="768x1024">Tablet (768x1024)</option>
              <option value="1280x720">HD (1280x720)</option>
              <option value="600x600">Cuadrado (600x600)</option>
              <option value="1024x768">Horizontal (1024x768)</option>
              <option value="720x1280">Vertical (720x1280)</option>
            </select>
          </label>
        </div>

        <div class="dimensions">
          <label class="field">
            <span>Ancho</span>
            <input id="width" name="width" type="number" value="480">
          </label>
          <label class="field">
            <span>Alto</span>
            <input id="height" name="height" type="number" value="720">
          </label>
        </div>

        <div class="options">
          <label class="field toggle">
            <input id="always-on-top" type="checkbox" checked>
            <span class="slider round"></span>
            <span>Mantener Ventana siempre arriba</span>
          </label>
        </div>

        <div class="actions">
          <button id="window-button" class="button" type="button">
            Mostrar en Ventana
            <svg fill="currentColor" role="img" width="1em" height="1em"
              viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M3 6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6Zm1 1v7c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V7H4Z"
                fill="currentColor">
              </path>
            </svg>
          </button>
          <hr />
          <button id="sidepanel-button" class="button" type="button">
            Mostrar en Panel Lateral
            <svg fill="currentColor" role="img" width="1em" height="1em"
              viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M3.3,1.8c-.8,0-1.5.7-1.5,1.5v5.4c0,.8.7,1.5,1.5,1.5h5.4c.8,0,1.5-.7,1.5-1.5V3.3c0-.8-.7-1.5-1.5-1.5H3.3ZM9.6,3.6H2.4v-.3c0-.5.4-.9.9-.9h5.4c.5,0,.9.4.9.9v.3ZM7.8,9.6H3.3c-.5,0-.9-.4-.9-.9v-4.5h5.4v5.4Z"
                fill="currentColor">
              </path>
            </svg>
          </button>
        </div>

        <p id="status" class="status"></p>
      </div>
    <div class="made-by">
      <div class="text-center">
        <a
          href="https://github.com/SystemAlex/" target="_blank"
          rel="noopener noreferrer"
          class="made-by-text">v
        </a>
      </div>
    </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
